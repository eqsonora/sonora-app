name: Bug report
description: Something in Sonora does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The fastest route is the feedback button inside Sonora, which attaches the details for you.
        **Never paste** licence keys, account emails, API keys or passwords here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Effects page
        2. Turn on crossfeed
        3. ...
    validations:
      required: true
  - type: input
    id: sonora
    attributes:
      label: Sonora version
      description: Options -> Updates
      placeholder: "1.9.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.6, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: output
    attributes:
      label: Audio output
      placeholder: "AirPods Pro 2 / built-in speakers / USB DAC"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images here. Check they do not show personal information.
